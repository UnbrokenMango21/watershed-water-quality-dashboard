name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - 'AGENTS.md'
      - 'docs/PHASE11A_EAS_PLATFORM_PROOF.md'
      - 'docs/PHASE11_EXECUTION_LOG.md'
      - 'docs/PHASE11_FLOW_MATRIX.md'
  push:
    branches:
      - platform-v0.1-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - 'AGENTS.md'
      - 'docs/PHASE11A_EAS_PLATFORM_PROOF.md'
      - 'docs/PHASE11_EXECUTION_LOG.md'
      - 'docs/PHASE11_FLOW_MATRIX.md'

permissions:
  contents: read

jobs:
  mobile:
    name: Expo / TypeScript health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repository hygiene
        working-directory: .
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.DS_Store$|^mobile/(GoogleService-Info\.plist|google-services\.json|ios/|android/)' || true)"
          if [ -n "$tracked" ]; then
            echo "Unexpected generated/private files are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Privacy telemetry guard
        run: npm run verify:privacy

      - name: Expo Doctor
        run: npx expo-doctor
