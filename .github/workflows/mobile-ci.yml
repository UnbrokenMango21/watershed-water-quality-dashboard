name: Mobile Production CI

on:
  pull_request:
    paths:
      - 'Phone App/**'
      - 'mobile/**'
      - 'web/**'
      - 'review/**'
      - 'config/**'
      - 'firebase/**'
      - 'functions/**'
      - 'tests/**'
      - 'validation/**'
      - 'package*.json'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - codex/mobile-production-integration-v1
      - codex/qc-trusted-web-v1
      - codex/qc-console-production-v1
    paths:
      - 'Phone App/**'
      - 'mobile/**'
      - 'web/**'
      - 'review/**'
      - 'config/**'
      - 'firebase/**'
      - 'functions/**'
      - 'tests/**'
      - 'validation/**'
      - 'package*.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend contracts and security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/firestore-rules/package-lock.json
            tests/validation-firestore/package-lock.json
            tests/review/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix tests/firestore-rules
      - run: npm ci --prefix tests/validation-firestore
      - run: npm ci --prefix tests/review
      - run: npm run test:contracts
      - name: Firestore, Storage, and validation persistence
        run: npx firebase emulators:exec --project central-pa-watershed-dev --only firestore,storage "node tests/firestore-rules/run-tests.cjs && node tests/firestore-rules/run-storage-tests.cjs && node tests/validation-firestore/run-tests.cjs"
      - name: Validation trigger integration
        run: npx firebase emulators:exec --project central-pa-watershed-dev --only firestore,functions "npm run test:trigger"
      - name: QC reviewer action and lifecycle integration
        run: npx firebase emulators:exec --project central-pa-watershed-dev --only firestore "npm run test:review"

  web:
    name: QC reviewer web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  android:
    name: Android native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phone App/Android App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, lint, debug, minified release, and instrumentation APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Room and repository instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd 'Phone App/Android App' && ./gradlew :app:connectedDebugAndroidTest

  ios:
    name: iOS native
    runs-on: macos-15
    defaults:
      run:
        working-directory: Phone App/iPhone App/PAWatershedWatch
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          destination_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$destination_id" >> "$GITHUB_ENV"
      - name: Build and unit tests
        run: xcodebuild test -project PAWatershedWatch.xcodeproj -scheme PAWatershedWatch -destination "$IOS_DESTINATION" -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=NO
      - name: Unsigned release archive
        run: xcodebuild archive -project PAWatershedWatch.xcodeproj -scheme PAWatershedWatch -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PAWatershedWatch.xcarchive" CODE_SIGNING_ALLOWED=NO

  legacy-expo:
    name: Legacy Expo regression guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npm run verify:contracts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run verify:privacy
      - run: npx expo export --platform ios --output-dir /tmp/phase11-export-ios
      - run: npx expo export --platform android --output-dir /tmp/phase11-export-android
      - run: npx expo-doctor

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)DerivedData/|(^|/)build/|(^|/)\.gradle/|xcuserdata|\.xcuserstate$|(^|/)local\.properties$|\.zip$' || true)"
          if [ -n "$tracked" ]; then
            echo "Unexpected generated or local files are tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: Media is deferred - production code must not reintroduce capture or upload
        shell: bash
        run: |
          # Phase 11 interim decision (docs/DEFERRED_MEDIA_FEATURE.md): active camera/photo/
          # audio capture is removed from the shipping apps until it is separately redesigned
          # and tested. This only scans production source under src/main (iOS: the app target,
          # excluding the test target) for concrete API usage - not docs, not test code, not
          # generic English words - so it fails on a real reintroduction, not on prose.
          ios_hits="$(git ls-files 'Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch/*.swift' \
            | xargs -I{} grep -lE 'AVAudioRecorder|AVCaptureSession|PHPickerViewController|PhotosPicker\(|UIImagePickerController|NSCameraUsageDescription|NSMicrophoneUsageDescription' {} 2>/dev/null || true)"
          android_hits="$(git ls-files 'Phone App/Android App/app/src/main/**/*.kt' 'Phone App/Android App/app/src/main/**/*.xml' 'Phone App/Android App/app/src/main/AndroidManifest.xml' 'Phone App/Android App/app/build.gradle.kts' \
            | xargs -I{} grep -lE 'MediaRecorder|androidx\.camera|PickVisualMedia|android\.permission\.CAMERA|android\.permission\.RECORD_AUDIO|FirebaseStorage|firebase-storage|StorageMetadata|StorageException|uploadIfNeeded|putFile\(' {} 2>/dev/null || true)"
          if [ -n "$ios_hits" ] || [ -n "$android_hits" ]; then
            echo "Active media capture or Android upload code was found in production source, but media is intentionally deferred for this phase (see docs/DEFERRED_MEDIA_FEATURE.md)."
            echo "$ios_hits"
            echo "$android_hits"
            echo "If reintroducing media capture is an intentional, reviewed future-phase change, update this check accordingly."
            exit 1
          fi
