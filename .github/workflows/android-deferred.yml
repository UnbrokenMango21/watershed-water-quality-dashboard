name: Android native (deferred)

# Android product and release work is deferred, not abandoned, until after the iOS 1.0 submission and
# publication milestone (docs/ROADMAP.md). This is the former "Android native" job from mobile-ci.yml,
# unchanged, so it no longer gates routine pull requests. Run it on demand from the Actions tab
# (or `gh workflow run android-deferred.yml --ref <branch>`); move it back into mobile-ci.yml when
# Android work resumes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-deferred-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Phone App/Android App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, lint, debug, minified release, and instrumentation APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Room and repository instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd 'Phone App/Android App' && ./gradlew :app:connectedDebugAndroidTest
