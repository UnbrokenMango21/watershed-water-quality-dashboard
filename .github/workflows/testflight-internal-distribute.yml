name: TestFlight Internal Distribution

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  distribute-internal:
    name: Attach processed build to internal TestFlight group
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[CI] TestFlight internal distribute 0.1.0 (7)'
    runs-on: macos-26
    timeout-minutes: 10

    env:
      ASC_API_KEY_ID: IPDY81DL8P2Z
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_APP_ID: '6800149959'
      TARGET_VERSION: '0.1.0'
      TARGET_BUILD: '7'
      TRIGGER_ISSUE: ${{ github.event.issue.number }}

    steps:
      - name: Record distribution run
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$TRIGGER_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Internal TestFlight distribution started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Normalize and validate App Store Connect key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import pathlib
          import subprocess
          import textwrap

          value = os.environ['ASC_API_KEY_P8_BASE64'].strip()
          if not value:
              raise RuntimeError('ASC_API_KEY_P8_BASE64 is empty.')

          if '-----BEGIN PRIVATE KEY-----' in value:
              key = value.replace('\\n', '\n')
          else:
              compact = ''.join(value.split())
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except binascii.Error as exc:
                  raise RuntimeError('App Store Connect key is not valid PEM/base64 material.') from exc

              try:
                  decoded_text = decoded.decode('utf-8')
              except UnicodeDecodeError:
                  decoded_text = None

              if decoded_text and '-----BEGIN PRIVATE KEY-----' in decoded_text:
                  key = decoded_text.replace('\\n', '\n')
              elif decoded and decoded[0] == 0x30:
                  key = (
                      '-----BEGIN PRIVATE KEY-----\n'
                      + '\n'.join(textwrap.wrap(compact, 64))
                      + '\n-----END PRIVATE KEY-----\n'
                  )
              else:
                  raise RuntimeError('App Store Connect key is not a recognized private-key representation.')

          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'asc' / 'AuthKey.p8'
          path.write_text(key)
          path.chmod(0o600)
          result = subprocess.run(
              ['/usr/bin/openssl', 'pkey', '-in', str(path), '-noout'],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if result.returncode != 0:
              raise RuntimeError('App Store Connect private key failed OpenSSL validation.')
          print('App Store Connect private key validated.')
          PY

      - name: Query internal groups and attach build
        id: distribute
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'time'
          require 'uri'

          def b64url(data)
            Base64.urlsafe_encode64(data, padding: false)
          end

          key = OpenSSL::PKey.read(File.read(File.join(ENV.fetch('RUNNER_TEMP'), 'asc', 'AuthKey.p8')))
          now = Time.now.to_i
          header = { alg: 'ES256', kid: ENV.fetch('ASC_API_KEY_ID'), typ: 'JWT' }
          payload = { sub: 'user', iat: now, exp: now + 1200, aud: 'appstoreconnect-v1' }
          signing_input = "#{b64url(JSON.generate(header))}.#{b64url(JSON.generate(payload))}"

          der_signature = key.sign(OpenSSL::Digest::SHA256.new, signing_input)
          sequence = OpenSSL::ASN1.decode(der_signature)
          r = sequence.value[0].value.to_i.to_s(16).rjust(64, '0')
          s = sequence.value[1].value.to_i.to_s(16).rjust(64, '0')
          signature = [r + s].pack('H*')
          token = "#{signing_input}.#{b64url(signature)}"

          def api_request(method, path, token, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            klass = case method
                    when :get then Net::HTTP::Get
                    when :post then Net::HTTP::Post
                    else raise "Unsupported HTTP method: #{method}"
                    end
            req = klass.new(uri)
            req['Authorization'] = "Bearer #{token}"
            req['Accept'] = 'application/json'
            if body
              req['Content-Type'] = 'application/json'
              req.body = JSON.generate(body)
            end
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
            unless response.code.to_i.between?(200, 299)
              safe_body = response.body.to_s[0, 4000]
              raise "App Store Connect API #{method.upcase} #{path} failed with HTTP #{response.code}: #{safe_body}"
            end
            return nil if response.body.to_s.empty?
            JSON.parse(response.body)
          end

          app_id = ENV.fetch('ASC_APP_ID')
          group_query = URI.encode_www_form(
            'fields[betaGroups]' => 'name,isInternalGroup,hasAccessToAllBuilds',
            'limit' => '200'
          )
          groups_response = api_request(:get, "/v1/apps/#{app_id}/betaGroups?#{group_query}", token)
          internal_groups = groups_response.fetch('data', []).select do |group|
            group.fetch('attributes', {})['isInternalGroup'] == true
          end

          build_query = URI.encode_www_form(
            'fields[builds]' => 'version,uploadedDate,processingState,buildAudienceType',
            'limit' => '200'
          )
          builds_response = api_request(:get, "/v1/apps/#{app_id}/builds?#{build_query}", token)
          candidates = builds_response.fetch('data', []).select do |build|
            attrs = build.fetch('attributes', {})
            attrs['version'].to_s == ENV.fetch('TARGET_BUILD') && attrs['processingState'].to_s == 'VALID'
          end
          raise "Processed build #{ENV.fetch('TARGET_BUILD')} was not found for app #{app_id}." if candidates.empty?
          build = candidates.max_by { |item| item.fetch('attributes', {})['uploadedDate'].to_s }
          build_id = build.fetch('id')

          result_path = File.join(ENV.fetch('RUNNER_TEMP'), 'internal-distribution-result.txt')
          group_names = internal_groups.map { |g| g.fetch('attributes', {})['name'].to_s }

          if internal_groups.empty?
            File.write(result_path, "BLOCKED: No internal TestFlight group exists for this app.\n")
            File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts 'result=blocked' }
            exit 0
          end

          all_builds_groups = internal_groups.select do |g|
            g.fetch('attributes', {})['hasAccessToAllBuilds'] == true
          end
          unless all_builds_groups.empty?
            names = all_builds_groups.map { |g| g.fetch('attributes', {})['name'].to_s }
            File.write(result_path, "READY: Build #{ENV.fetch('TARGET_VERSION')} (#{ENV.fetch('TARGET_BUILD')}) is automatically available to internal group(s): #{names.join(', ')}.\n")
            File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts 'result=ready' }
            exit 0
          end

          preferred = internal_groups.select do |g|
            g.fetch('attributes', {})['name'].to_s.casecmp('Team (Expo)').zero?
          end
          target = if preferred.length == 1
                     preferred.first
                   elsif internal_groups.length == 1
                     internal_groups.first
                   end

          unless target
            File.write(result_path, "BLOCKED: Multiple internal TestFlight groups exist and no unambiguous target was selected: #{group_names.join(', ')}.\n")
            File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts 'result=blocked' }
            exit 0
          end

          group_id = target.fetch('id')
          group_name = target.fetch('attributes', {})['name'].to_s
          api_request(
            :post,
            "/v1/betaGroups/#{group_id}/relationships/builds",
            token,
            { data: [{ type: 'builds', id: build_id }] }
          )

          linkage = api_request(:get, "/v1/betaGroups/#{group_id}/relationships/builds?limit=200", token)
          linked_ids = linkage.fetch('data', []).map { |item| item['id'] }
          raise 'Build linkage verification failed after App Store Connect returned success.' unless linked_ids.include?(build_id)

          File.write(result_path, "READY: Build #{ENV.fetch('TARGET_VERSION')} (#{ENV.fetch('TARGET_BUILD')}) is attached to internal TestFlight group: #{group_name}.\n")
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |f| f.puts 'result=ready' }
          RUBY

      - name: Report internal distribution result
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.distribute.outputs.result }}
        shell: bash
        run: |
          body="$(cat "$RUNNER_TEMP/internal-distribution-result.txt")"
          gh issue comment "$TRIGGER_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"
          if [ "$RESULT" = 'ready' ]; then
            gh issue close "$TRIGGER_ISSUE" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi

      - name: Report workflow failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$TRIGGER_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Internal distribution automation failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
