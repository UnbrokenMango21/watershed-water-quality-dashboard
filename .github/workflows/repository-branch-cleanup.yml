name: One-time repository branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repository-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  consolidate-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve milestones and unique historical lines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PA Watershed Repository Lock'
          git config user.email '62219953+UnbrokenMango21@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags

          tag_once() {
            local tag="$1"
            local sha="$2"
            local message="$3"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag already exists: $tag"
              return
            fi
            git cat-file -e "$sha^{commit}"
            git tag -a "$tag" "$sha" -m "$message"
          }

          tag_once phase10-baseline 794e55c800e512036bbfdf5086708b1ecd4198c5 'Locked Phase 10 scientific/backend baseline before native Phase 11.'
          tag_once phase11-native-mobile-v1 7dbc714ca5a92b32ab159d09e8786fcc86f5bbeb 'Native iOS + Android production-integration milestone.'
          tag_once qc-console-v1 c1842878395847cb590311d88bf93fdf980ab054 'Trusted QC console/backend milestone and pre-consolidation authoritative candidate.'
          tag_once history-pre-reset-main-2026-08-12 bf6371636bbd8436694d43d94e2aa5723fd952f3 'Historical pre-reset main snapshot retained before obsolete branch deletion.'
          tag_once history-phase11-mobile-v1-2026-08-12 cca83940a5120798b8f43d7abb0c7f8e604470d1 'Historical superseded Phase 11 mobile implementation checkpoint.'
          tag_once history-ci-testflight-status-2026-08-12 4910792a0351c88a53b0cf36a10467128db68383 'Historical CI/TestFlight setup line retained before obsolete branch deletion.'
          tag_once history-copilot-dashboard-2026-08-12 f1d720688bff2f38aba317fd9148912b68d69a2c 'Historical superseded dashboard implementation checkpoint.'
          tag_once history-phase11-remediation-live-2026-08-14 00cb8980486c92bb4b7de2cfdf253caf16de195d 'Historical divergent Phase 11 remediation line retained before branch cleanup.'

          git push origin \
            refs/tags/phase10-baseline \
            refs/tags/phase11-native-mobile-v1 \
            refs/tags/qc-console-v1 \
            refs/tags/history-pre-reset-main-2026-08-12 \
            refs/tags/history-phase11-mobile-v1-2026-08-12 \
            refs/tags/history-ci-testflight-status-2026-08-12 \
            refs/tags/history-copilot-dashboard-2026-08-12 \
            refs/tags/history-phase11-remediation-live-2026-08-14

      - name: Delete superseded remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'archive/ci-testflight-status-2026-08-12'
            'archive/copilot-dashboard-2026-08-12'
            'archive/phase11-mobile-v1-2026-08-12'
            'archive/platform-foundation-2026-08-12'
            'archive/pre-reset-main-2026-08-12'
            'ci/testflight-status'
            'codex/android-native-v1'
            'codex/mobile-production-integration-v1'
            'codex/qc-console-production-v1'
            'codex/qc-trusted-web-v1'
            'codex/repository-consolidation-v1'
            'copilot/build-water-quality-dashboard'
            'docs/project-roadmap-2026-08-13'
            'phase11-remediation-actual'
            'phase11-remediation-authority'
            'phase11-remediation-candidate'
            'phase11-remediation-exec'
            'phase11-remediation-finalize'
            'phase11-remediation-live'
            'phase11-remediation-patch'
            'phase11-remediation-run'
            'phase11-remediation-runner'
            'phase11-remediation-safety'
            'phase11-remediation-stage'
            'phase11-remediation-temp'
            'phase11-remediation-test'
            'phase11-remediation-use-this'
            'phase11-remediation-work'
            'phase11-remediation-working'
            'phase11/mobile-v1'
            'platform-v0.1-foundation'
            'sync/phase11-local-2026-08-13'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          remaining="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)"
          echo 'Remaining remote branches:'
          echo "$remaining"
          test "$remaining" = 'main'
