name: Compare TestFlight Export Compliance

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  compare-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_APP_ID: '6800149959'
      ASC_KEY_ID: IPDY81DL8P2Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc-key.raw
          if grep -q 'BEGIN.*PRIVATE KEY' /tmp/asc-key.raw 2>/dev/null; then cp /tmp/asc-key.raw /tmp/asc-key.p8; else openssl pkey -inform DER -in /tmp/asc-key.raw -out /tmp/asc-key.p8; fi
          chmod 600 /tmp/asc-key.p8
      - name: Compare builds 9 and 10
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const key=fs.readFileSync('/tmp/asc-key.p8','utf8');
          const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          function jwt(){const now=Math.floor(Date.now()/1000);const h=enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'});const p=enc({sub:'user',iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});const i=`${h}.${p}`;const s=crypto.sign('sha256',Buffer.from(i),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');return `${i}.${s}`}
          async function get(path){const r=await fetch(`https://api.appstoreconnect.apple.com${path}`,{headers:{Authorization:`Bearer ${jwt()}`}});const t=await r.text();if(!r.ok)throw new Error(`${r.status}: ${t}`);return JSON.parse(t)}
          (async()=>{
            const appId=process.env.ASC_APP_ID;
            const list=await get(`/v1/builds?filter%5Bapp%5D=${appId}&fields%5Bbuilds%5D=version,processingState,usesNonExemptEncryption,buildBetaDetail,appEncryptionDeclaration,uploadedDate&include=buildBetaDetail,appEncryptionDeclaration&sort=-uploadedDate&limit=50`);
            for(const n of ['9','10']){
              const b=list.data.find(x=>String(x.attributes?.version)===n);
              if(!b){console.log(`BUILD_${n}=NOT_FOUND`);continue}
              const did=b.relationships?.buildBetaDetail?.data?.id;
              const d=(list.included||[]).find(x=>x.type==='buildBetaDetails'&&x.id===did);
              const eid=b.relationships?.appEncryptionDeclaration?.data?.id;
              const e=(list.included||[]).find(x=>x.type==='appEncryptionDeclarations'&&x.id===eid);
              console.log(`BUILD_${n}_ID=${b.id}`);
              console.log(`BUILD_${n}_PROCESSING=${b.attributes?.processingState}`);
              console.log(`BUILD_${n}_USES_NON_EXEMPT_ENCRYPTION=${b.attributes?.usesNonExemptEncryption}`);
              console.log(`BUILD_${n}_INTERNAL_STATE=${d?.attributes?.internalBuildState||'UNKNOWN'}`);
              console.log(`BUILD_${n}_EXTERNAL_STATE=${d?.attributes?.externalBuildState||'UNKNOWN'}`);
              console.log(`BUILD_${n}_ENCRYPTION_DECLARATION_ID=${eid||'NONE'}`);
              if(e) console.log(`BUILD_${n}_ENCRYPTION_DECLARATION_STATE=${e.attributes?.appEncryptionDeclarationState||e.attributes?.state||'UNKNOWN'}`);
            }
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          NODE
      - name: Destroy temporary credentials
        if: always()
        run: rm -f /tmp/asc-key.raw /tmp/asc-key.p8
