name: ASC Existing App Audit

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  audit-existing-app:
    runs-on: macos-14
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_KEY_ID: IPDY81DL8P2Z
      ASC_OLD_BUNDLE_ID: org.centralpawatershed.mobile
      ASC_NEW_BUNDLE_ID: org.watershed.pawatershedwatch
    steps:
      - uses: actions/checkout@v4
      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ASC_API_KEY_P8_BASE64:-}" || { echo "ASC API key secret is missing"; exit 1; }
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc-key.bin
          if grep -aq "BEGIN .*PRIVATE KEY" /tmp/asc-key.bin; then
            cp /tmp/asc-key.bin /tmp/AuthKey.p8
          else
            openssl pkey -inform DER -in /tmp/asc-key.bin -out /tmp/AuthKey.p8
          fi
          chmod 600 /tmp/AuthKey.p8
          openssl pkey -in /tmp/AuthKey.p8 -check -noout
      - name: Install current Fastlane
        shell: bash
        run: |
          set -euo pipefail
          gem install fastlane -v 2.238.0 --no-document
          fastlane --version
      - name: Resolve exact App Store Connect metadata
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'spaceship'
          token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch('ASC_KEY_ID'),
            issuer_id: nil,
            filepath: '/tmp/AuthKey.p8',
            duration: 1200,
            in_house: false
          )
          Spaceship::ConnectAPI.token = token
          apps = Spaceship::ConnectAPI::App.all
          [ENV.fetch('ASC_OLD_BUNDLE_ID'), ENV.fetch('ASC_NEW_BUNDLE_ID')].each do |target|
            app = apps.find { |candidate| candidate.bundle_id == target }
            if app
              puts "APP_FOUND bundle_id=#{app.bundle_id} apple_id=#{app.id} name=#{app.name.inspect}"
              puts "APP_SKU bundle_id=#{app.bundle_id} sku=#{app.sku.inspect}" if app.respond_to?(:sku)
            else
              puts "APP_NOT_FOUND bundle_id=#{target}"
            end
          end
          RUBY
      - name: Remove key material
        if: always()
        shell: bash
        run: rm -f /tmp/asc-key.bin /tmp/AuthKey.p8
