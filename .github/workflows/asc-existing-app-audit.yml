name: Native iOS TestFlight Release

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  release-testflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      EAS_PROJECT_ID: 3b378200-8390-4b03-9fea-ca42413e7fa5
      RELEASE_SHA: c80e1183a3e5ac5488ea687bfcfa3dc9c6b1716d
      ASC_APP_ID: '6800149959'
      ASC_KEY_ID: IPDY81DL8P2Z
      BUNDLE_ID: org.centralpawatershed.mobile
      APP_VERSION: '0.1.0'
      BUILD_NUMBER: '10'
      EXPO_NO_CAPABILITY_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Prepare exact native SwiftUI release for EAS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          rm -rf /tmp/watershed-release
          git worktree add --detach /tmp/watershed-release "${RELEASE_SHA}"
          test "$(git -C /tmp/watershed-release rev-parse HEAD)" = "${RELEASE_SHA}"

          app=/tmp/watershed-release/eas-native-ios
          mkdir -p "$app/ios"
          cp -R "/tmp/watershed-release/Phone App/iPhone App/PAWatershedWatch/." "$app/ios/"

          cat >"$app/package.json" <<'JSON'
          {"name":"watershed-native-ios-release","private":true,"version":"0.1.0"}
          JSON

          cat >"$app/app.json" <<JSON
          {
            "expo": {
              "name": "Central PA Watershed",
              "slug": "watershed-dashboard",
              "owner": "watershed-dashboard",
              "version": "${APP_VERSION}",
              "ios": {"bundleIdentifier":"${BUNDLE_ID}","buildNumber":"${BUILD_NUMBER}"},
              "extra": {"eas":{"projectId":"${EAS_PROJECT_ID}"}}
            }
          }
          JSON

          cat >"$app/eas.json" <<JSON
          {
            "cli":{"version":">= 16.18.0","appVersionSource":"local"},
            "build":{"production":{"distribution":"store","ios":{"scheme":"PAWatershedWatch","buildConfiguration":"Release","image":"latest"}}},
            "submit":{"production":{"ios":{"ascAppId":"${ASC_APP_ID}"}}}
          }
          JSON

          # Generic EAS iOS workers always run CocoaPods for an ios/ tree.
          # This native app uses SPM only, so satisfy the worker with a zero-dependency Podfile.
          cat >"$app/ios/Podfile" <<'RUBY'
          platform :ios, '18.0'
          project 'PAWatershedWatch.xcodeproj'
          target 'PAWatershedWatch' do
          end
          RUBY

          # Expo's provisioning mutator assumes PBXProject.attributes.TargetAttributes exists.
          # This hand-authored native project legitimately omitted that optional dictionary.
          # Add an empty dictionary in the disposable wrapper so EAS can populate the app target.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/watershed-release/eas-native-ios/ios/PAWatershedWatch.xcodeproj/project.pbxproj')
          s=p.read_text()
          needle='\t\t\t\tLastUpgradeCheck = 1600;\n\t\t\t};'
          repl='\t\t\t\tLastUpgradeCheck = 1600;\n\t\t\t\tTargetAttributes = {\n\t\t\t\t};\n\t\t\t};'
          if 'TargetAttributes = {' not in s:
              if needle not in s:
                  raise SystemExit('PBXProject attributes anchor not found')
              s=s.replace(needle,repl,1)
              p.write_text(s)
          assert 'TargetAttributes = {' in p.read_text()
          PY

          (cd "$app" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)

          pbx="$app/ios/PAWatershedWatch.xcodeproj/project.pbxproj"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$pbx"
          grep -q "MARKETING_VERSION = ${APP_VERSION};" "$pbx"
          grep -q "CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};" "$pbx"
          grep -q 'TargetAttributes = {' "$pbx"
          ! grep -q 'com.apple.developer.devicecheck.appattest-environment' "$app/ios/PAWatershedWatch/PAWatershedWatch.entitlements"
          echo "RELEASE_SHA=${RELEASE_SHA}"
          echo "RELEASE_IDENTITY=${BUNDLE_ID} ${APP_VERSION} (${BUILD_NUMBER})"

      - name: Build exact native SwiftUI release on EAS
        working-directory: /tmp/watershed-release/eas-native-ios
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --message "Native SwiftUI TestFlight ${APP_VERSION} (${BUILD_NUMBER}) from ${RELEASE_SHA}" \
            --non-interactive \
            --wait \
            --json > /tmp/eas-build.json

          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/eas-build.json','utf8'));
          const b=Array.isArray(raw)?raw[0]:raw;
          if(!b?.id) throw new Error('EAS build output did not contain a build ID');
          if(b.status!=='FINISHED') throw new Error(`EAS build did not finish successfully: ${b.status}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`EAS_BUILD_ID=${b.id}\n`);
          console.log(`EAS_BUILD_ID=${b.id}`);
          console.log(`EAS_BUILD_STATUS=${b.status}`);
          console.log(`EAS_BUILD_COMMIT=${b.gitCommitHash || process.env.RELEASE_SHA}`);
          console.log(`EAS_BUILD_URL=https://expo.dev/accounts/watershed-dashboard/projects/watershed-dashboard/builds/${b.id}`);
          NODE

      - name: Verify finished EAS build identity
        working-directory: /tmp/watershed-release/eas-native-ios
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "${EAS_BUILD_ID}" --json > /tmp/eas-build-view.json
          node <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/eas-build-view.json','utf8'));
          if(b.status!=='FINISHED') throw new Error(`Unexpected EAS status ${b.status}`);
          if(b.gitCommitHash!==process.env.RELEASE_SHA) throw new Error(`Unexpected release commit ${b.gitCommitHash}`);
          console.log(`EAS_BUILD_ID=${b.id}`);
          console.log(`EAS_BUILD_STATUS=${b.status}`);
          console.log(`EAS_BUILD_VERSION=${b.appVersion ?? process.env.APP_VERSION}`);
          console.log(`EAS_BUILD_NUMBER=${b.appBuildVersion ?? process.env.BUILD_NUMBER}`);
          console.log(`EAS_BUILD_ARTIFACT_URL=${b.artifacts?.buildUrl || 'available-on-build-dashboard'}`);
          NODE

      - name: Submit exact EAS build to App Store Connect TestFlight
        working-directory: /tmp/watershed-release/eas-native-ios
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            --id "${EAS_BUILD_ID}" \
            --what-to-test "Phase 11 native field collection: sign in, capture GPS, record water temperature, save draft, submit to Firebase staging, and verify QC lifecycle. Media capture remains intentionally deferred." \
            --non-interactive \
            --wait \
            --verbose 2>&1 | tee /tmp/eas-submit.log

          submission_id="$(grep -Eo 'submissions/[0-9a-fA-F-]{36}' /tmp/eas-submit.log | tail -1 | cut -d/ -f2 || true)"
          if [ -z "$submission_id" ]; then
            submission_id="$(sed -nE 's/^[[:space:]]*ID:[[:space:]]*([0-9a-fA-F-]{36})[[:space:]]*$/\1/p' /tmp/eas-submit.log | tail -1 || true)"
          fi
          test -n "$submission_id" || { echo 'EAS submission completed but submission ID could not be parsed'; exit 1; }
          echo "EAS_SUBMISSION_ID=$submission_id" >> "$GITHUB_ENV"
          echo "EAS_SUBMISSION_ID=$submission_id"
          echo "EAS_SUBMISSION_STATUS=finished"
          echo "EAS_SUBMISSION_URL=https://expo.dev/accounts/watershed-dashboard/projects/watershed-dashboard/submissions/$submission_id"

      - name: Prepare App Store Connect readback key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ASC_API_KEY_P8_BASE64:-}"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc-key.raw
          if grep -q 'BEGIN.*PRIVATE KEY' /tmp/asc-key.raw 2>/dev/null; then
            cp /tmp/asc-key.raw /tmp/asc-key.p8
          else
            openssl pkey -inform DER -in /tmp/asc-key.raw -out /tmp/asc-key.p8
          fi
          openssl pkey -in /tmp/asc-key.p8 -check -noout
          chmod 600 /tmp/asc-key.p8
          echo 'ASC_READBACK_KEY=ready'

      - name: Verify build 10 is visible in App Store Connect TestFlight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const key=fs.readFileSync('/tmp/asc-key.p8','utf8');
          const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          function jwt(){
            const now=Math.floor(Date.now()/1000);
            const h=enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'});
            const p=enc({sub:'user',iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});
            const input=`${h}.${p}`;
            const sig=crypto.sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            return `${input}.${sig}`;
          }
          async function builds(){
            const u=new URL('https://api.appstoreconnect.apple.com/v1/builds');
            u.searchParams.set('filter[app]',process.env.ASC_APP_ID);
            u.searchParams.set('include','preReleaseVersion');
            u.searchParams.set('sort','-uploadedDate');
            u.searchParams.set('limit','30');
            const r=await fetch(u,{headers:{Authorization:`Bearer ${jwt()}`}});
            const t=await r.text();
            if(!r.ok) throw new Error(`App Store Connect ${r.status}: ${t.slice(0,800)}`);
            return JSON.parse(t);
          }
          (async()=>{
            for(let attempt=1;attempt<=40;attempt++){
              const data=await builds();
              const b=data.data.find(x=>String(x.attributes?.version)===process.env.BUILD_NUMBER);
              if(b){
                const preId=b.relationships?.preReleaseVersion?.data?.id;
                const pre=(data.included||[]).find(x=>x.type==='preReleaseVersions'&&x.id===preId);
                console.log(`ASC_BUILD_ID=${b.id}`);
                console.log(`ASC_APP_VERSION=${pre?.attributes?.version || process.env.APP_VERSION}`);
                console.log(`ASC_BUILD_NUMBER=${b.attributes.version}`);
                console.log(`ASC_PROCESSING_STATE=${b.attributes.processingState}`);
                console.log(`ASC_UPLOAD_DATE=${b.attributes.uploadedDate}`);
                console.log(`ASC_TESTFLIGHT_URL=https://appstoreconnect.apple.com/apps/${process.env.ASC_APP_ID}/testflight/ios`);
                if(b.attributes.processingState==='FAILED') process.exit(2);
                return;
              }
              console.log(`ASC_READBACK attempt=${attempt} build=${process.env.BUILD_NUMBER} not_visible_yet`);
              await new Promise(r=>setTimeout(r,30000));
            }
            throw new Error(`Build ${process.env.BUILD_NUMBER} did not become visible in App Store Connect within 20 minutes`);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Destroy temporary release material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/asc-key.raw /tmp/asc-key.p8 /tmp/eas-build.json /tmp/eas-build-view.json /tmp/eas-submit.log
          git worktree remove --force /tmp/watershed-release 2>/dev/null || true
