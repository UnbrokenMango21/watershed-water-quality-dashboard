name: Regenerate Existing iOS App Store Profile

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  regenerate-profile:
    runs-on: macos-14
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      EAS_PROJECT_ID: 3b378200-8390-4b03-9fea-ca42413e7fa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Restore historical EAS project and declare App Attest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          test -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}"
          git checkout qc-console-v1 -- mobile
          cd mobile
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' GoogleService-Info.plist)" = 'org.centralpawatershed.mobile'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app.json')
          data=json.loads(p.read_text())
          ios=data['expo'].setdefault('ios', {})
          assert ios.get('bundleIdentifier') == 'org.centralpawatershed.mobile'
          ios.setdefault('entitlements', {})['com.apple.developer.devicecheck.appattest-environment']='production'
          p.write_text(json.dumps(data, indent=2)+'\n')
          e=Path('eas.json')
          eas=json.loads(e.read_text())
          prod=eas.get('build',{}).get('production',{})
          eas['build']={'production':prod}
          e.write_text(json.dumps(eas, indent=2)+'\n')
          print('LOCAL_APP_ATTEST=production')
          PY
          npm ci
          npx --yes eas-cli@latest whoami
      - name: Recover EAS-stored team App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['EXPO_TOKEN']
          app_id=os.environ['EAS_PROJECT_ID']
          def gql(query, variables):
              body=json.dumps({'query':query,'variables':variables}).encode()
              req=urllib.request.Request('https://api.expo.dev/graphql', data=body, method='POST', headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r: data=json.load(r)
              if data.get('errors'):
                  raise RuntimeError(data['errors'])
              return data['data']
          q1='''query AppAsc($appId: String!) { app { byId(appId: $appId) { iosAppCredentials { appleAppIdentifier { bundleIdentifier } appStoreConnectApiKeyForSubmissions { id keyIdentifier issuerIdentifier } } } } }'''
          creds=gql(q1, {'appId':app_id})['app']['byId']['iosAppCredentials'] or []
          target=next((c for c in creds if (c.get('appleAppIdentifier') or {}).get('bundleIdentifier')=='org.centralpawatershed.mobile'), None)
          if not target or not target.get('appStoreConnectApiKeyForSubmissions'):
              raise SystemExit('No EAS submission API key attached to org.centralpawatershed.mobile')
          meta=target['appStoreConnectApiKeyForSubmissions']
          q2='''query AppStoreConnectApiKeyById($ascApiKeyId: ID!) { appStoreConnectApiKey { byId(id: $ascApiKeyId) { issuerIdentifier keyIdentifier keyP8 } } }'''
          key=gql(q2, {'ascApiKeyId':meta['id']})['appStoreConnectApiKey']['byId']
          open('/tmp/eas-team-asc.p8','w').write(key['keyP8'])
          os.chmod('/tmp/eas-team-asc.p8',0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('EXPO_ASC_API_KEY_PATH=/tmp/eas-team-asc.p8\n')
              f.write('EXPO_ASC_KEY_ID='+key['keyIdentifier']+'\n')
              f.write('EXPO_ASC_ISSUER_ID='+key['issuerIdentifier']+'\n')
              f.write('EXPO_APPLE_TEAM_ID=DL4B9RRLYP\n')
              f.write('EXPO_APPLE_TEAM_TYPE=INDIVIDUAL\n')
          print('EAS_TEAM_ASC_KEY=ready')
          print('EAS_TEAM_ASC_KEY_ID='+key['keyIdentifier'])
          print('EAS_TEAM_ASC_ISSUER_ID='+key['issuerIdentifier'])
          PY
      - name: Sync Apple capability and regenerate App Store profile
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest credentials:configure-build -p ios -e production
      - name: Download regenerated credentials and verify App Attest
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/download-eas-credentials.exp <<'EXP'
          set timeout 90
          log_user 0
          spawn npx --yes eas-cli@latest credentials -p ios
          expect {
            -re {What do you want to do\?} { send -- "\033\[B\033\[B\033\[B\r" }
            timeout { exit 41 }
            eof { exit 42 }
          }
          expect {
            -re {What do you want to do\?} { send -- "\r" }
            timeout { exit 43 }
            eof { exit 44 }
          }
          expect {
            -re {synced with values stored on EAS servers} { send -- "\003"; expect eof }
            timeout { exit 45 }
            eof { exit 46 }
          }
          EXP
          /usr/bin/expect /tmp/download-eas-credentials.exp || status=$?
          status=${status:-0}
          test -f credentials.json || { echo "credentials download failed status=$status"; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          data=json.load(open('credentials.json'))['ios']
          pathlib.Path('/tmp/profile-path').write_text(data['provisioningProfilePath'])
          PY
          profile="$(cat /tmp/profile-path)"
          security cms -D -i "$profile" > /tmp/profile.plist
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          echo "PROFILE_APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist)"
          appattest="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.devicecheck.appattest-environment' /tmp/profile.plist)"
          echo "PROFILE_APP_ATTEST=$appattest"
          test "$appattest" = 'production'
      - name: Destroy recovered credentials
        if: always()
        shell: bash
        run: |
          rm -rf mobile/credentials mobile/credentials.json mobile/GoogleService-Info.plist /tmp/eas-team-asc.p8 /tmp/profile-path /tmp/profile.plist /tmp/download-eas-credentials.exp
