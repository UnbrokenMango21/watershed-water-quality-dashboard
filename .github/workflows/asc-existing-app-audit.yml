name: Enable Internal TestFlight Build 10

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  enable-internal-testflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_APP_ID: '6800149959'
      ASC_KEY_ID: IPDY81DL8P2Z
      APP_VERSION: '0.1.0'
      BUILD_NUMBER: '10'
      GROUP_NAME: PA Watershed Internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ASC_API_KEY_P8_BASE64:-}"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc-key.raw
          if grep -q 'BEGIN.*PRIVATE KEY' /tmp/asc-key.raw 2>/dev/null; then
            cp /tmp/asc-key.raw /tmp/asc-key.p8
          else
            openssl pkey -inform DER -in /tmp/asc-key.raw -out /tmp/asc-key.p8
          fi
          openssl pkey -in /tmp/asc-key.p8 -check -noout
          chmod 600 /tmp/asc-key.p8

      - name: Enroll Account Holder and expose build in TestFlight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const key = fs.readFileSync('/tmp/asc-key.p8','utf8');
          const enc = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          function jwt() {
            const now = Math.floor(Date.now()/1000);
            const h = enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'});
            const p = enc({sub:'user',iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});
            const input = `${h}.${p}`;
            const sig = crypto.sign('sha256',Buffer.from(input),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            return `${input}.${sig}`;
          }
          async function api(method,path,body,ok=[200,201,204]) {
            const r = await fetch(`https://api.appstoreconnect.apple.com${path}`,{
              method,
              headers:{Authorization:`Bearer ${jwt()}`,'Content-Type':'application/json'},
              body:body===undefined?undefined:JSON.stringify(body)
            });
            const text = await r.text();
            let data=null;
            if(text){try{data=JSON.parse(text)}catch{data=text}}
            if(!ok.includes(r.status)) throw new Error(`${method} ${path} -> ${r.status}: ${typeof data==='string'?data:JSON.stringify(data)}`);
            return data;
          }
          (async()=>{
            const appId=process.env.ASC_APP_ID;
            const buildNumber=process.env.BUILD_NUMBER;
            const version=process.env.APP_VERSION;
            const groupName=process.env.GROUP_NAME;

            const builds=await api('GET',`/v1/builds?filter%5Bapp%5D=${appId}&include=preReleaseVersion&sort=-uploadedDate&limit=50`);
            const build=builds.data.find(b=>String(b.attributes?.version)===buildNumber);
            if(!build) throw new Error(`Build ${buildNumber} not found`);
            const preId=build.relationships?.preReleaseVersion?.data?.id;
            const pre=(builds.included||[]).find(x=>x.type==='preReleaseVersions'&&x.id===preId);
            if((pre?.attributes?.version||version)!==version) throw new Error('Unexpected marketing version');
            if(build.attributes.processingState!=='VALID') throw new Error(`Build state ${build.attributes.processingState}`);
            console.log(`ASC_BUILD_ID=${build.id}`);
            console.log(`ASC_VERSION=${version}`);
            console.log(`ASC_BUILD_NUMBER=${buildNumber}`);
            console.log(`ASC_PROCESSING_STATE=${build.attributes.processingState}`);

            const users=await api('GET','/v1/users?fields%5Busers%5D=username,firstName,lastName,roles,allAppsVisible&limit=200');
            const holders=users.data.filter(u=>(u.attributes?.roles||[]).includes('ACCOUNT_HOLDER'));
            if(holders.length!==1) throw new Error(`Expected one Account Holder, found ${holders.length}`);
            const holder=holders[0];
            const email=holder.attributes.username;
            console.log(`ACCOUNT_HOLDER=${holder.attributes.firstName||''} ${holder.attributes.lastName||''} <${email}>`);

            let groups=await api('GET',`/v1/betaGroups?filter%5Bapp%5D=${appId}&filter%5BisInternalGroup%5D=true&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds&limit=200`);
            let group=groups.data.find(g=>g.attributes?.name===groupName);
            if(!group){
              const created=await api('POST','/v1/betaGroups',{data:{type:'betaGroups',attributes:{name:groupName,isInternalGroup:true,hasAccessToAllBuilds:true},relationships:{app:{data:{type:'apps',id:appId}}}}});
              group=created.data;
              console.log(`INTERNAL_GROUP_CREATED=${group.id}`);
            } else {
              console.log(`INTERNAL_GROUP_REUSED=${group.id}`);
            }
            if(!group.attributes?.hasAccessToAllBuilds){
              const updated=await api('PATCH',`/v1/betaGroups/${group.id}`,{data:{type:'betaGroups',id:group.id,attributes:{hasAccessToAllBuilds:true}}});
              group=updated.data;
              console.log('INTERNAL_GROUP_ALL_BUILDS_ENABLED=yes');
            }
            if(!group.attributes?.isInternalGroup) throw new Error('Group is not internal');
            if(!group.attributes?.hasAccessToAllBuilds) throw new Error('Internal group does not have all-build access');
            console.log(`INTERNAL_GROUP_ID=${group.id}`);
            console.log(`INTERNAL_GROUP_ALL_BUILDS=${group.attributes.hasAccessToAllBuilds}`);

            const testers=await api('GET','/v1/betaTesters?fields%5BbetaTesters%5D=firstName,lastName,email,inviteType,state&limit=200');
            let tester=testers.data.find(t=>String(t.attributes?.email||'').toLowerCase()===email.toLowerCase());
            if(!tester){
              const attrs={email};
              if(holder.attributes.firstName) attrs.firstName=holder.attributes.firstName;
              if(holder.attributes.lastName) attrs.lastName=holder.attributes.lastName;
              const created=await api('POST','/v1/betaTesters',{data:{type:'betaTesters',attributes:attrs,relationships:{betaGroups:{data:[{type:'betaGroups',id:group.id}]}}}});
              tester=created.data;
              console.log(`INTERNAL_TESTER_CREATED=${tester.id}`);
            } else {
              console.log(`INTERNAL_TESTER_REUSED=${tester.id}`);
              const rel=await api('GET',`/v1/betaTesters/${tester.id}/relationships/betaGroups?limit=200`);
              if(!(rel.data||[]).some(x=>x.id===group.id)){
                await api('POST',`/v1/betaTesters/${tester.id}/relationships/betaGroups`,{data:[{type:'betaGroups',id:group.id}]});
                console.log('TESTER_ADDED_TO_GROUP=yes');
              } else console.log('TESTER_ADDED_TO_GROUP=already_present');
            }

            // Also give the Account Holder direct access to this exact build when Apple permits it.
            try {
              const direct=await api('GET',`/v1/betaTesters/${tester.id}/relationships/builds?limit=200`);
              if(!(direct.data||[]).some(x=>x.id===build.id)){
                await api('POST',`/v1/betaTesters/${tester.id}/relationships/builds`,{data:[{type:'builds',id:build.id}]});
                console.log('DIRECT_BUILD_ACCESS_ADDED=yes');
              } else console.log('DIRECT_BUILD_ACCESS_ADDED=already_present');
            } catch(e) {
              console.log(`DIRECT_BUILD_ACCESS_NOTE=${e.message}`);
            }

            try {
              const invitation=await api('POST','/v1/betaTesterInvitations',{data:{type:'betaTesterInvitations',relationships:{app:{data:{type:'apps',id:appId}},betaTester:{data:{type:'betaTesters',id:tester.id}}}}});
              console.log(`TESTFLIGHT_INVITATION_SENT=${invitation?.data?.id||'yes'}`);
            } catch(e) {
              console.log(`TESTFLIGHT_INVITATION_NOTE=${e.message}`);
            }

            const verifyGroup=await api('GET',`/v1/betaGroups/${group.id}?fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds`);
            const verifyTesters=await api('GET',`/v1/betaGroups/${group.id}/betaTesters?fields%5BbetaTesters%5D=firstName,lastName,email,inviteType,state&limit=200`);
            const v=verifyTesters.data.find(t=>String(t.attributes?.email||'').toLowerCase()===email.toLowerCase());
            if(!verifyGroup.data.attributes?.hasAccessToAllBuilds) throw new Error('Verification failed: group lacks all-build access');
            if(!v) throw new Error('Verification failed: Account Holder not in internal group');
            console.log('TESTFLIGHT_DISTRIBUTION_READY=yes');
            console.log(`TESTFLIGHT_TESTER_EMAIL=${email}`);
            console.log(`TESTFLIGHT_TESTER_STATE=${v.attributes?.state||'UNKNOWN'}`);
            console.log(`TESTFLIGHT_GROUP_ID=${group.id}`);
            console.log(`TESTFLIGHT_BUILD_ID=${build.id}`);
            console.log(`TESTFLIGHT_URL=https://appstoreconnect.apple.com/apps/${appId}/testflight/ios`);
          })().catch(e=>{console.error(e.stack||e.message||String(e));process.exit(1)});
          NODE

      - name: Destroy temporary credentials
        if: always()
        shell: bash
        run: rm -f /tmp/asc-key.raw /tmp/asc-key.p8
