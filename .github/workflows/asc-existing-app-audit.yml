name: Enable Internal TestFlight Build 10

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  enable-internal-testflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_APP_ID: '6800149959'
      ASC_KEY_ID: IPDY81DL8P2Z
      APP_VERSION: '0.1.0'
      BUILD_NUMBER: '10'
      GROUP_NAME: PA Watershed Internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ASC_API_KEY_P8_BASE64:-}"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc-key.raw
          if grep -q 'BEGIN.*PRIVATE KEY' /tmp/asc-key.raw 2>/dev/null; then
            cp /tmp/asc-key.raw /tmp/asc-key.p8
          else
            openssl pkey -inform DER -in /tmp/asc-key.raw -out /tmp/asc-key.p8
          fi
          openssl pkey -in /tmp/asc-key.p8 -check -noout
          chmod 600 /tmp/asc-key.p8

      - name: Distribute build to Account Holder in internal TestFlight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const key = fs.readFileSync('/tmp/asc-key.p8', 'utf8');
          const enc = x => Buffer.from(JSON.stringify(x)).toString('base64url');

          function jwt() {
            const now = Math.floor(Date.now() / 1000);
            const h = enc({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' });
            const p = enc({ sub: 'user', iat: now - 30, exp: now + 600, aud: 'appstoreconnect-v1' });
            const input = `${h}.${p}`;
            const sig = crypto.sign('sha256', Buffer.from(input), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            return `${input}.${sig}`;
          }

          async function api(method, path, body, ok = [200, 201, 204]) {
            const res = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${jwt()}`,
                'Content-Type': 'application/json'
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await res.text();
            let data = null;
            if (text) {
              try { data = JSON.parse(text); } catch { data = text; }
            }
            if (!ok.includes(res.status)) {
              const printable = typeof data === 'string' ? data : JSON.stringify(data);
              throw new Error(`${method} ${path} -> ${res.status}: ${printable?.slice(0, 2000)}`);
            }
            return data;
          }

          (async () => {
            const appId = process.env.ASC_APP_ID;
            const version = process.env.APP_VERSION;
            const buildNumber = process.env.BUILD_NUMBER;
            const groupName = process.env.GROUP_NAME;

            const builds = await api('GET', `/v1/builds?filter%5Bapp%5D=${encodeURIComponent(appId)}&include=preReleaseVersion&sort=-uploadedDate&limit=50`);
            const build = builds.data.find(b => String(b.attributes?.version) === buildNumber);
            if (!build) throw new Error(`App Store Connect build ${buildNumber} was not found.`);
            const preId = build.relationships?.preReleaseVersion?.data?.id;
            const pre = (builds.included || []).find(x => x.type === 'preReleaseVersions' && x.id === preId);
            const marketing = pre?.attributes?.version || version;
            if (marketing !== version) throw new Error(`Build ${buildNumber} belongs to version ${marketing}, expected ${version}.`);
            if (build.attributes.processingState !== 'VALID') throw new Error(`Build ${buildNumber} processing state is ${build.attributes.processingState}, not VALID.`);
            console.log(`ASC_BUILD_ID=${build.id}`);
            console.log(`ASC_APP_VERSION=${marketing}`);
            console.log(`ASC_BUILD_NUMBER=${build.attributes.version}`);
            console.log(`ASC_PROCESSING_STATE=${build.attributes.processingState}`);

            const users = await api('GET', `/v1/users?fields%5Busers%5D=username,firstName,lastName,roles,allAppsVisible&limit=200`);
            const holders = users.data.filter(u => (u.attributes?.roles || []).includes('ACCOUNT_HOLDER'));
            if (holders.length !== 1) throw new Error(`Expected exactly one ACCOUNT_HOLDER user, found ${holders.length}.`);
            const holder = holders[0];
            const holderEmail = holder.attributes.username;
            console.log(`INTERNAL_TESTER_USER=${holder.attributes.firstName || ''} ${holder.attributes.lastName || ''} <${holderEmail}>`);
            console.log(`INTERNAL_TESTER_ROLES=${(holder.attributes.roles || []).join(',')}`);

            let groups = await api('GET', `/v1/betaGroups?filter%5Bapp%5D=${encodeURIComponent(appId)}&filter%5BisInternalGroup%5D=true&fields%5BbetaGroups%5D=name,isInternalGroup,hasAccessToAllBuilds&limit=200`);
            let group = groups.data.find(g => g.attributes?.name === groupName);
            if (!group) {
              const created = await api('POST', '/v1/betaGroups', {
                data: {
                  type: 'betaGroups',
                  attributes: {
                    name: groupName,
                    isInternalGroup: true,
                    hasAccessToAllBuilds: true
                  },
                  relationships: {
                    app: { data: { type: 'apps', id: appId } }
                  }
                }
              });
              group = created.data;
              console.log(`INTERNAL_GROUP_CREATED=${group.id}`);
            } else {
              console.log(`INTERNAL_GROUP_REUSED=${group.id}`);
            }
            console.log(`INTERNAL_GROUP_NAME=${group.attributes?.name || groupName}`);

            let groupBuilds = await api('GET', `/v1/betaGroups/${group.id}/relationships/builds?limit=200`);
            if (!(groupBuilds.data || []).some(x => x.id === build.id)) {
              await api('POST', `/v1/betaGroups/${group.id}/relationships/builds`, {
                data: [{ type: 'builds', id: build.id }]
              });
              console.log('BUILD_ADDED_TO_INTERNAL_GROUP=yes');
            } else {
              console.log('BUILD_ADDED_TO_INTERNAL_GROUP=already_present');
            }

            let testers = await api('GET', `/v1/betaTesters?fields%5BbetaTesters%5D=firstName,lastName,email,inviteType,state&limit=200`);
            let tester = testers.data.find(t => String(t.attributes?.email || '').toLowerCase() === String(holderEmail).toLowerCase());
            if (!tester) {
              const createdTester = await api('POST', '/v1/betaTesters', {
                data: {
                  type: 'betaTesters',
                  attributes: {
                    email: holderEmail,
                    firstName: holder.attributes.firstName || undefined,
                    lastName: holder.attributes.lastName || undefined
                  },
                  relationships: {
                    betaGroups: { data: [{ type: 'betaGroups', id: group.id }] }
                  }
                }
              });
              tester = createdTester.data;
              console.log(`INTERNAL_TESTER_CREATED=${tester.id}`);
            } else {
              console.log(`INTERNAL_TESTER_REUSED=${tester.id}`);
              const testerGroups = await api('GET', `/v1/betaTesters/${tester.id}/relationships/betaGroups?limit=200`);
              if (!(testerGroups.data || []).some(x => x.id === group.id)) {
                await api('POST', `/v1/betaTesters/${tester.id}/relationships/betaGroups`, {
                  data: [{ type: 'betaGroups', id: group.id }]
                });
                console.log('TESTER_ADDED_TO_INTERNAL_GROUP=yes');
              } else {
                console.log('TESTER_ADDED_TO_INTERNAL_GROUP=already_present');
              }
            }

            const invitationBody = {
              data: {
                type: 'betaTesterInvitations',
                relationships: {
                  app: { data: { type: 'apps', id: appId } },
                  betaTester: { data: { type: 'betaTesters', id: tester.id } }
                }
              }
            };
            try {
              const invitation = await api('POST', '/v1/betaTesterInvitations', invitationBody);
              console.log(`TESTFLIGHT_INVITATION_SENT=${invitation?.data?.id || 'yes'}`);
            } catch (e) {
              console.log(`TESTFLIGHT_INVITATION_WARNING=${e.message}`);
            }

            const verifyBuilds = await api('GET', `/v1/betaGroups/${group.id}/relationships/builds?limit=200`);
            const verifyTesters = await api('GET', `/v1/betaGroups/${group.id}/betaTesters?fields%5BbetaTesters%5D=firstName,lastName,email,inviteType,state&limit=200`);
            const buildLinked = (verifyBuilds.data || []).some(x => x.id === build.id);
            const verifiedTester = (verifyTesters.data || []).find(t => String(t.attributes?.email || '').toLowerCase() === String(holderEmail).toLowerCase());
            if (!buildLinked) throw new Error('Verification failed: build is not linked to the internal group.');
            if (!verifiedTester) throw new Error('Verification failed: Account Holder is not in the internal TestFlight group.');

            console.log(`TESTFLIGHT_DISTRIBUTION_READY=yes`);
            console.log(`TESTFLIGHT_TESTER_EMAIL=${holderEmail}`);
            console.log(`TESTFLIGHT_TESTER_STATE=${verifiedTester.attributes?.state || 'UNKNOWN'}`);
            console.log(`TESTFLIGHT_GROUP_ID=${group.id}`);
            console.log(`TESTFLIGHT_BUILD_ID=${build.id}`);
            console.log(`TESTFLIGHT_URL=https://appstoreconnect.apple.com/apps/${appId}/testflight/ios`);
          })().catch(err => {
            console.error(err.stack || err.message || String(err));
            process.exit(1);
          });
          NODE

      - name: Destroy temporary credentials
        if: always()
        shell: bash
        run: rm -f /tmp/asc-key.raw /tmp/asc-key.p8
