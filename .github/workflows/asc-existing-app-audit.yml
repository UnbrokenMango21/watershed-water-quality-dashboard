name: Recover Existing iOS Signing Audit

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  recover-signing:
    runs-on: macos-14
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 3b378200-8390-4b03-9fea-ca42413e7fa5
      IOS_BUNDLE_ID: org.centralpawatershed.mobile
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the existing APP_STORE signing material from EAS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN is missing'; exit 1; }
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request, urllib.error

          query = r'''
          query ExistingIosSigning($appId: String!) {
            app {
              byId(appId: $appId) {
                id
                fullName
                iosAppCredentials {
                  id
                  appleAppIdentifier { id bundleIdentifier }
                  appleTeam { id appleTeamIdentifier appleTeamName }
                  iosAppBuildCredentialsList {
                    id
                    iosDistributionType
                    distributionCertificate {
                      id certificateP12 certificatePassword serialNumber
                      developerPortalIdentifier validityNotBefore validityNotAfter
                    }
                    provisioningProfile {
                      id provisioningProfile expiration developerPortalIdentifier status
                    }
                  }
                }
              }
            }
          }
          '''
          body = json.dumps({'query': query, 'variables': {'appId': os.environ['EAS_PROJECT_ID']}}).encode()
          req = urllib.request.Request(
              'https://api.expo.dev/graphql', data=body, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['EXPO_TOKEN'], 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print('EAS GraphQL HTTP failure:', exc.code)
              raise
          if payload.get('errors'):
              print('EAS GraphQL errors:')
              for error in payload['errors']:
                  print('-', error.get('message', 'unknown error'))
              raise SystemExit(2)
          app = payload['data']['app']['byId']
          print('EAS_APP_FULL_NAME=' + app['fullName'])
          target = None
          for credentials in app.get('iosAppCredentials') or []:
              identifier = credentials.get('appleAppIdentifier') or {}
              if identifier.get('bundleIdentifier') == os.environ['IOS_BUNDLE_ID']:
                  target = credentials
                  break
          if not target:
              raise SystemExit('No EAS iOS credentials found for ' + os.environ['IOS_BUNDLE_ID'])
          team = target.get('appleTeam') or {}
          print('APPLE_TEAM_ID=' + str(team.get('appleTeamIdentifier')))
          print('APPLE_TEAM_NAME=' + str(team.get('appleTeamName')))
          store = next((x for x in target.get('iosAppBuildCredentialsList') or [] if x.get('iosDistributionType') == 'APP_STORE'), None)
          if not store:
              raise SystemExit('No APP_STORE build credentials are stored in EAS')
          cert = store.get('distributionCertificate') or {}
          profile = store.get('provisioningProfile') or {}
          required = {
              'certificateP12': cert.get('certificateP12'),
              'certificatePassword': cert.get('certificatePassword'),
              'provisioningProfile': profile.get('provisioningProfile'),
          }
          missing = [k for k, v in required.items() if not v]
          if missing:
              raise SystemExit('EAS signing material incomplete: ' + ', '.join(missing))
          pathlib.Path('/tmp/dist-cert.p12').write_bytes(base64.b64decode(required['certificateP12']))
          pathlib.Path('/tmp/profile.mobileprovision').write_bytes(base64.b64decode(required['provisioningProfile']))
          pathlib.Path('/tmp/p12-password').write_text(required['certificatePassword'])
          for path in ('/tmp/dist-cert.p12','/tmp/profile.mobileprovision','/tmp/p12-password'):
              os.chmod(path, 0o600)
          print('EAS_APP_STORE_CREDENTIALS=present')
          print('CERT_SERIAL=' + str(cert.get('serialNumber')))
          print('CERT_VALID_FROM=' + str(cert.get('validityNotBefore')))
          print('CERT_VALID_TO=' + str(cert.get('validityNotAfter')))
          print('PROFILE_STATUS=' + str(profile.get('status')))
          print('PROFILE_EXPIRATION=' + str(profile.get('expiration')))
          print('PROFILE_PORTAL_ID=' + str(profile.get('developerPortalIdentifier')))
          PY
      - name: Validate certificate, profile, bundle ID, and Release entitlements
        shell: bash
        run: |
          set -euo pipefail
          pass="$(cat /tmp/p12-password)"
          openssl pkcs12 -in /tmp/dist-cert.p12 -passin "pass:$pass" -clcerts -nokeys -out /tmp/dist-cert.pem
          openssl x509 -in /tmp/dist-cert.pem -noout -subject -issuer -dates -fingerprint -sha256
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          echo "PROFILE_EXPIRATION_DATE=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/profile.plist)"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist)"
          team_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' /tmp/profile.plist)"
          echo "PROFILE_APPLICATION_IDENTIFIER=$app_identifier"
          echo "PROFILE_TEAM_IDENTIFIER=$team_identifier"
          case "$app_identifier" in
            *.org.centralpawatershed.mobile) ;;
            *) echo 'Provisioning profile does not match the existing App Store bundle ID'; exit 1;;
          esac
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.devicecheck.appattest-environment' /tmp/profile.plist >/tmp/appattest 2>/dev/null; then
            echo "PROFILE_APP_ATTEST=$(cat /tmp/appattest)"
          else
            echo 'PROFILE_APP_ATTEST=missing'
            exit 3
          fi
          test "$(cat /tmp/appattest)" = 'production'
      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: rm -f /tmp/dist-cert.p12 /tmp/profile.mobileprovision /tmp/p12-password /tmp/dist-cert.pem /tmp/profile.plist /tmp/appattest
