name: Inspect Failed Native iOS EAS Build

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  inspect-eas-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 3b378200-8390-4b03-9fea-ca42413e7fa5
      FAILED_BUILD_ID: b3547d19-0646-4968-98a4-fc79d2a10561
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Restore EAS project context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eas-inspect
          cat >/tmp/eas-inspect/app.json <<JSON
          {
            "expo": {
              "name": "Central PA Watershed",
              "slug": "watershed-dashboard",
              "owner": "watershed-dashboard",
              "extra": {"eas": {"projectId": "${EAS_PROJECT_ID}"}}
            }
          }
          JSON
          cat >/tmp/eas-inspect/package.json <<'JSON'
          {"name":"eas-inspect","private":true,"version":"0.0.0"}
          JSON
      - name: Fetch exact EAS build failure
        working-directory: /tmp/eas-inspect
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest build:view "${FAILED_BUILD_ID}" --json > /tmp/build.json
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('/tmp/build.json','utf8'));
          console.log(`EAS_BUILD_ID=${b.id}`);
          console.log(`EAS_BUILD_STATUS=${b.status}`);
          console.log(`EAS_BUILD_PLATFORM=${b.platform}`);
          console.log(`EAS_BUILD_VERSION=${b.appVersion}`);
          console.log(`EAS_BUILD_NUMBER=${b.appBuildVersion}`);
          console.log(`EAS_BUILD_COMMIT=${b.gitCommitHash || 'unknown'}`);
          console.log(`EAS_BUILD_ERROR_CODE=${b.error?.errorCode || 'none'}`);
          console.log(`EAS_BUILD_ERROR_MESSAGE=${b.error?.message || 'none'}`);
          console.log(`EAS_BUILD_ARTIFACTS=${JSON.stringify(b.artifacts || {})}`);
          console.log(`EAS_BUILD_LOG_FILES=${JSON.stringify(b.logFiles || [])}`);
          fs.writeFileSync('/tmp/log-urls.txt', (b.logFiles || []).join('\n') + '\n');
          NODE
      - name: Print decoded EAS build logs
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while IFS= read -r url || [ -n "$url" ]; do
            [ -n "$url" ] || continue
            i=$((i+1))
            echo "===== EAS REMOTE LOG $i ====="
            curl --compressed --fail --location --silent --show-error "$url" | tail -n 900
          done < /tmp/log-urls.txt
          test "$i" -gt 0 || { echo "No remote logFiles were returned by EAS."; exit 1; }
