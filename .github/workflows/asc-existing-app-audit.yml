name: Recover Existing iOS Signing Audit

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  recover-signing:
    runs-on: macos-14
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Restore the historical EAS project definition
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN is missing'; exit 1; }
          git checkout qc-console-v1 -- mobile
          cd mobile
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('eas.json')
          data = json.loads(p.read_text())
          production = data.get('build', {}).get('production', {})
          data['build'] = {'production': production}
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npm ci
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest config -p ios -e production --json --non-interactive >/tmp/eas-config.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/eas-config.json'))
          exp=data.get('exp', data)
          print('EAS_PROJECT_NAME=' + str(exp.get('name')))
          print('EAS_SLUG=' + str(exp.get('slug')))
          print('EAS_IOS_BUNDLE=' + str((exp.get('ios') or {}).get('bundleIdentifier')))
          print('EAS_PROJECT_ID=' + str(((exp.get('extra') or {}).get('eas') or {}).get('projectId')))
          PY
      - name: Download remote iOS build credentials without changing them
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/download-eas-credentials.exp <<'EXP'
          set timeout 180
          log_user 1
          spawn npx --yes eas-cli@latest credentials -p ios
          expect {
            -re {What do you want to do\?} {
              send "\033\[B\033\[B\033\[B\r"
            }
            timeout { puts "Timed out waiting for EAS high-level credentials menu"; exit 21 }
            eof { puts "EAS credentials exited before high-level menu"; exit 22 }
          }
          expect {
            -re {What do you want to do\?} {
              send "\r"
            }
            timeout { puts "Timed out waiting for credentials.json menu"; exit 23 }
            eof { puts "EAS credentials exited before credentials.json menu"; exit 24 }
          }
          expect {
            -re {synced with values stored on EAS servers} {
              send "\003"
              expect eof
            }
            -re {There are no credentials configured} { puts "No remote credentials available"; exit 25 }
            timeout { puts "Timed out waiting for EAS credential download"; exit 26 }
            eof { puts "EAS credentials exited before download completed"; exit 27 }
          }
          EXP
          /usr/bin/expect /tmp/download-eas-credentials.exp || status=$?
          status=${status:-0}
          test -f credentials.json || { echo "credentials.json was not produced (expect status $status)"; exit 1; }
          exit 0
      - name: Validate recovered certificate and provisioning profile
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          data=json.load(open('credentials.json'))['ios']
          cert=data['distributionCertificate']
          profile=data['provisioningProfilePath']
          print('DIST_CERT_PATH=' + cert['path'])
          print('DIST_CERT_PASSWORD_PRESENT=' + str(bool(cert.get('password'))).lower())
          print('PROFILE_PATH=' + profile)
          assert pathlib.Path(cert['path']).is_file()
          assert pathlib.Path(profile).is_file()
          pathlib.Path('/tmp/p12-password').write_text(cert['password'])
          pathlib.Path('/tmp/p12-path').write_text(cert['path'])
          pathlib.Path('/tmp/profile-path').write_text(profile)
          PY
          p12="$(cat /tmp/p12-path)"
          pass="$(cat /tmp/p12-password)"
          profile="$(cat /tmp/profile-path)"
          openssl pkcs12 -in "$p12" -passin "pass:$pass" -clcerts -nokeys -out /tmp/dist-cert.pem
          openssl x509 -in /tmp/dist-cert.pem -noout -subject -issuer -dates -fingerprint -sha256
          security cms -D -i "$profile" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/profile.plist
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist)"
          team_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' /tmp/profile.plist)"
          echo "PROFILE_APPLICATION_IDENTIFIER=$app_identifier"
          echo "PROFILE_TEAM_IDENTIFIER=$team_identifier"
          case "$app_identifier" in
            *.org.centralpawatershed.mobile) ;;
            *) echo 'Provisioning profile does not match existing App Store bundle ID'; exit 1;;
          esac
      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf mobile/credentials mobile/credentials.json /tmp/p12-password /tmp/p12-path /tmp/profile-path /tmp/profile.plist /tmp/dist-cert.pem /tmp/eas-config.json /tmp/download-eas-credentials.exp
