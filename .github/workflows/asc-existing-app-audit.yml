name: Regenerate Existing iOS App Store Profile

on:
  push:
    branches:
      - ops/asc-existing-app-audit

permissions:
  contents: read

jobs:
  regenerate-profile:
    runs-on: macos-14
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      EAS_PROJECT_ID: 3b378200-8390-4b03-9fea-ca42413e7fa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Restore historical EAS project and declare App Attest
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          test -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}"
          git checkout qc-console-v1 -- mobile
          cd mobile
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > GoogleService-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' GoogleService-Info.plist)" = 'org.centralpawatershed.mobile'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app.json')
          data=json.loads(p.read_text())
          ios=data['expo'].setdefault('ios', {})
          assert ios.get('bundleIdentifier') == 'org.centralpawatershed.mobile'
          ios.setdefault('entitlements', {})['com.apple.developer.devicecheck.appattest-environment']='production'
          p.write_text(json.dumps(data, indent=2)+'\n')
          e=Path('eas.json')
          eas=json.loads(e.read_text())
          prod=eas.get('build',{}).get('production',{})
          eas['build']={'production':prod}
          e.write_text(json.dumps(eas, indent=2)+'\n')
          print('LOCAL_APP_ATTEST=production')
          PY
          npm ci
          npx --yes eas-cli@latest whoami
      - name: Recover EAS-stored team App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.EXPO_TOKEN;
          const appId = process.env.EAS_PROJECT_ID;
          async function gql(query, variables) {
            const res = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                'user-agent': 'eas-cli-release-automation'
              },
              body: JSON.stringify({query, variables})
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`EAS GraphQL HTTP ${res.status}: ${text.slice(0, 500)}`);
            const data = JSON.parse(text);
            if (data.errors) throw new Error(JSON.stringify(data.errors));
            return data.data;
          }
          (async () => {
            const q1 = `query AppAsc($appId: String!) { app { byId(appId: $appId) { iosAppCredentials { appleAppIdentifier { bundleIdentifier } appStoreConnectApiKeyForSubmissions { id keyIdentifier issuerIdentifier } } } } }`;
            const d1 = await gql(q1, {appId});
            const creds = d1.app.byId.iosAppCredentials || [];
            const target = creds.find(c => c.appleAppIdentifier?.bundleIdentifier === 'org.centralpawatershed.mobile');
            if (!target?.appStoreConnectApiKeyForSubmissions) throw new Error('No EAS submission API key attached to org.centralpawatershed.mobile');
            const meta = target.appStoreConnectApiKeyForSubmissions;
            const q2 = `query AppStoreConnectApiKeyById($ascApiKeyId: ID!) { appStoreConnectApiKey { byId(id: $ascApiKeyId) { issuerIdentifier keyIdentifier keyP8 } } }`;
            const key = (await gql(q2, {ascApiKeyId: meta.id})).appStoreConnectApiKey.byId;
            fs.writeFileSync('/tmp/eas-team-asc.p8', key.keyP8, {mode: 0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,
              `EXPO_ASC_API_KEY_PATH=/tmp/eas-team-asc.p8\nEXPO_ASC_KEY_ID=${key.keyIdentifier}\nEXPO_ASC_ISSUER_ID=${key.issuerIdentifier}\nEXPO_APPLE_TEAM_ID=DL4B9RRLYP\nEXPO_APPLE_TEAM_TYPE=INDIVIDUAL\n`);
            console.log('EAS_TEAM_ASC_KEY=ready');
            console.log(`EAS_TEAM_ASC_KEY_ID=${key.keyIdentifier}`);
            console.log(`EAS_TEAM_ASC_ISSUER_ID=${key.issuerIdentifier}`);
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE
      - name: Sync Apple capability and regenerate App Store profile
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest credentials:configure-build -p ios -e production
      - name: Download regenerated credentials and verify App Attest
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/download-eas-credentials.exp <<'EXP'
          set timeout 90
          log_user 0
          spawn npx --yes eas-cli@latest credentials -p ios
          expect {
            -re {What do you want to do\?} { send -- "\033\[B\033\[B\033\[B\r" }
            timeout { exit 41 }
            eof { exit 42 }
          }
          expect {
            -re {What do you want to do\?} { send -- "\r" }
            timeout { exit 43 }
            eof { exit 44 }
          }
          expect {
            -re {synced with values stored on EAS servers} { send -- "\003"; expect eof }
            timeout { exit 45 }
            eof { exit 46 }
          }
          EXP
          /usr/bin/expect /tmp/download-eas-credentials.exp || status=$?
          status=${status:-0}
          test -f credentials.json || { echo "credentials download failed status=$status"; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          data=json.load(open('credentials.json'))['ios']
          pathlib.Path('/tmp/profile-path').write_text(data['provisioningProfilePath'])
          PY
          profile="$(cat /tmp/profile-path)"
          security cms -D -i "$profile" > /tmp/profile.plist
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)"
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)"
          echo "PROFILE_APPLICATION_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist)"
          appattest="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.devicecheck.appattest-environment' /tmp/profile.plist)"
          echo "PROFILE_APP_ATTEST=$appattest"
          test "$appattest" = 'production'
      - name: Destroy recovered credentials
        if: always()
        shell: bash
        run: |
          rm -rf mobile/credentials mobile/credentials.json mobile/GoogleService-Info.plist /tmp/eas-team-asc.p8 /tmp/profile-path /tmp/profile.plist /tmp/download-eas-credentials.exp
