name: Patch iOS Correction Resubmit V2

on:
  push:
    branches: [ops/firebase-control]
    paths:
      - '.github/workflows/patch-ios-correction-resubmit-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: fix/ios-correction-resubmit-ack
          fetch-depth: 0
      - name: Apply focused patch
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit and push fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch/ProductionData.swift' 'Phone App/iPhone App/PAWatershedWatch/PAWatershedWatchTests/ModelTests.swift'
          git commit -m 'fix(ios): allow correction revision resubmission'
          git push origin HEAD:fix/ios-correction-resubmit-ack
