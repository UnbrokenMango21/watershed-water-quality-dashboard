name: One-time iOS release asset repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-release-assets.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add iOS asset catalog and wire it into the target
        shell: bash
        run: |
          set -euo pipefail
          project='Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch.xcodeproj/project.pbxproj'
          assets='Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch/Assets.xcassets'
          mkdir -p "$assets/AppIcon.appiconset" "$assets/AccentColor.colorset"

          cat > "$assets/Contents.json" <<'JSON'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          cat > "$assets/AppIcon.appiconset/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          cat > "$assets/AccentColor.colorset/Contents.json" <<'JSON'
          {
            "colors" : [
              {
                "color" : {
                  "color-space" : "srgb",
                  "components" : {
                    "alpha" : "1.000",
                    "blue" : "0.247",
                    "green" : "0.314",
                    "red" : "0.141"
                  }
                },
                "idiom" : "universal"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

          base64 -d > "$assets/AppIcon.appiconset/AppIcon-1024.png" <<'B64'
          
          B64

          python3 - <<'PY'
          from pathlib import Path
          p = Path('Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch.xcodeproj/project.pbxproj')
          s = p.read_text()
          replacements = [
              (
                  '\t\tAA0000000000000000000025 /* FirebaseAppCheck in Frameworks */ = {isa = PBXBuildFile; productRef = AA0000000000000000000015 /* FirebaseAppCheck */; };\n/* End PBXBuildFile section */',
                  '\t\tAA0000000000000000000025 /* FirebaseAppCheck in Frameworks */ = {isa = PBXBuildFile; productRef = AA0000000000000000000015 /* FirebaseAppCheck */; };\n\t\tAA0000000000000000000026 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000027 /* Assets.xcassets */; };\n/* End PBXBuildFile section */'
              ),
              (
                  '\t\tAA0000000000000000000007 /* PAWatershedWatch.entitlements */ = {isa = PBXFileReference; includeInIndex = 1; lastKnownFileType = text.plist.entitlements; path = PAWatershedWatch.entitlements; sourceTree = "<group>"; };\n/* End PBXFileReference section */',
                  '\t\tAA0000000000000000000007 /* PAWatershedWatch.entitlements */ = {isa = PBXFileReference; includeInIndex = 1; lastKnownFileType = text.plist.entitlements; path = PAWatershedWatch.entitlements; sourceTree = "<group>"; };\n\t\tAA0000000000000000000027 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };\n/* End PBXFileReference section */'
              ),
              (
                  '\t\t\tchildren = (\n\t\t\t\tAA0000000000000000000007 /* PAWatershedWatch.entitlements */,\n\t\t\t\tAA0000000000000000000003 /* GoogleService-Info.plist */,',
                  '\t\t\tchildren = (\n\t\t\t\tAA0000000000000000000007 /* PAWatershedWatch.entitlements */,\n\t\t\t\tAA0000000000000000000027 /* Assets.xcassets */,\n\t\t\t\tAA0000000000000000000003 /* GoogleService-Info.plist */,'
              ),
              (
                  '\t\t4D716591CF94673A2B4B5D76 /* Resources */ = {\n\t\t\tisa = PBXResourcesBuildPhase;\n\t\t\tbuildActionMask = 2147483647;\n\t\t\tfiles = (\n\t\t\t\tAA0000000000000000000004 /* GoogleService-Info.plist in Resources */,',
                  '\t\t4D716591CF94673A2B4B5D76 /* Resources */ = {\n\t\t\tisa = PBXResourcesBuildPhase;\n\t\t\tbuildActionMask = 2147483647;\n\t\t\tfiles = (\n\t\t\t\tAA0000000000000000000026 /* Assets.xcassets in Resources */,\n\t\t\t\tAA0000000000000000000004 /* GoogleService-Info.plist in Resources */,'
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one project match, found {count}: {old[:80]!r}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png')
          data = p.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('App icon is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1024, 1024):
              raise SystemExit(f'Unexpected icon dimensions: {width}x{height}')
          print('Verified RGB PNG dimensions:', width, height)
          PY

      - name: Commit release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PA Watershed CI'
          git config user.email '62219953+UnbrokenMango21@users.noreply.github.com'
          git add 'Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch.xcodeproj/project.pbxproj' \
                  'Phone App/iPhone App/PAWatershedWatch/PAWatershedWatch/Assets.xcassets'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No release asset changes needed.'
            exit 0
          fi
          git commit -m 'fix(ios): add release app icon assets'
          git push origin HEAD:main
