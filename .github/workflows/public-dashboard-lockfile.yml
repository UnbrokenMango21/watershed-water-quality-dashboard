name: Public Dashboard Lockfile

on:
  push:
    branches:
      - final/public-dashboard-v1
    paths:
      - 'public-dashboard/package.json'
      - '.github/workflows/public-dashboard-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/public-dashboard-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Generate lockfile
        working-directory: public-dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build(public-dashboard): add npm lockfile"
            git push origin HEAD:final/public-dashboard-v1
          fi
