name: ArcGIS Publication CI
on:
  pull_request:
    paths:
      - 'publication/**'
      - 'functions/index.mjs'
      - 'config/arcgis_publication_schema.json'
      - 'config/arcgis_resources.json'
      - 'config/production_measurement_catalog.json'
      - 'config/publication_contract.json'
      - 'scripts/provision_arcgis_publication.py'
      - 'scripts/verify_arcgis_publication.py'
      - 'scripts/inventory_arcgis_legacy.py'
      - 'scripts/retry_arcgis_publication.mjs'
      - 'tests/publication/**'
      - 'package.json'
      - '.github/workflows/publication-ci.yml'
  push:
    branches: [main]
    paths:
      - 'publication/**'
      - 'functions/index.mjs'
      - 'config/arcgis_publication_schema.json'
      - 'config/arcgis_resources.json'
      - 'config/production_measurement_catalog.json'
      - 'config/publication_contract.json'
      - 'scripts/provision_arcgis_publication.py'
      - 'scripts/verify_arcgis_publication.py'
      - 'scripts/inventory_arcgis_legacy.py'
      - 'scripts/retry_arcgis_publication.mjs'
      - 'tests/publication/**'
      - 'package.json'
      - '.github/workflows/publication-ci.yml'
permissions: { contents: read }
jobs:
  publication-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python3 -m unittest discover -s tests/publication -p '*_test.py'
      - run: npm run test:publication
      - run: npm run test:contracts
      - name: Parse ArcGIS Pro Python automation
        run: >-
          python -m py_compile
          scripts/provision_arcgis_publication.py
          scripts/verify_arcgis_publication.py
          scripts/inventory_arcgis_legacy.py
